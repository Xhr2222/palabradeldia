name: Palabra del día

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palabra-del-dia
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-word.mjs

      - run: node scripts/close-votes.mjs
        if: ${{ !cancelled() }}

      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet data/; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Actualización $(date -u +%F)"
          git push